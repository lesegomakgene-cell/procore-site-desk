# Render Blueprint - pre-fills the service settings when you deploy.
# Free web service: sleeps after 15 min idle, ~30-60s to wake. No card needed.
services:
  - type: web
    name: procore-site-desk
    runtime: node
    plan: free
    # KEEP ACCOUNTS SAFE: the free plan forgets everything when the app restarts or
    # sleeps. For real use, switch to the Starter plan and add a disk (about $7 + $0.25
    # a month), by un-commenting the lines below. The app finds /var/data by itself.
    #   plan: starter
    #   disk:
    #     name: sitedesk-data
    #     mountPath: /var/data
    #     sizeGB: 1
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # Render will prompt you to paste this (kept secret)
      - key: MODEL
        value: claude-sonnet-5-5   # cheaper and faster: claude-haiku-5-5
      - key: SITE_AGENT_NAME
        value: Lesego
      - key: ADMIN_PASSWORD
        sync: false          # protects /admin (statistics and people). Choose a long one.
      - key: SIGNUP_CODE
        sync: false          # a word or number the team needs to create an account
      - key: RESEND_API_KEY
        sync: false          # free at resend.com - emails you when someone requests a session
      - key: NOTIFY_EMAIL
        sync: false          # the SAME email you signed up to Resend with
      - key: SITE_AGENT_WHATSAPP
        sync: false          # e.g. 0821234567 - lets people message you if an alert fails
      - key: SITE_AGENT_EMAIL
        sync: false          # optional - shown to people as another way to reach you
      - key: REQUEST_WEBHOOK_URL
        sync: false          # optional - a Slack/Discord webhook for instant chat alerts

  # InstantSiteMail - drop in an Outlook email, get a contracts-manager reply.
  # Lives in the instantsitemail/ folder. Password-protected (APP_PASSWORD).
  - type: web
    name: instantsitemail
    runtime: node
    plan: free
    rootDir: instantsitemail
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz  # public "ok" endpoint so Render knows the app is up
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # Render will prompt you to paste this (kept secret)
      - key: APP_PASSWORD
        sync: false          # choose a long password - it protects your work mail
      - key: HOST
        value: 0.0.0.0       # listen publicly (the app refuses to start without APP_PASSWORD)
      - key: MODEL
        value: claude-opus-5-5
      - key: EFFORT
        value: high

  # SiteInspect - site inspections, actions and reports for a main contractor.
  # Lives in the siteinspect/ folder. Password-protected (APP_PASSWORD).
  # NOTE: the free plan's disk is wiped on every deploy/restart. For real use add
  # a persistent disk (paid instance) and point DATA_DIR at it, e.g. /var/data.
  - type: web
    name: siteinspect
    runtime: node
    plan: free
    rootDir: siteinspect
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: APP_PASSWORD
        sync: false          # one shared password for the site team
      - key: HOST
        value: 0.0.0.0
      - key: COMPANY_NAME
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false          # optional - enables AI report summaries
      - key: DATA_DIR
        value: data          # change to your persistent disk mount, e.g. /var/data
